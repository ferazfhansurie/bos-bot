appId: ai.bos.bot
productName: BOS Bot
copyright: Copyright © 2026 BOS Bot
artifactName: BOS-Bot-${version}-${arch}.${ext}

protocols:
  - name: BOS Bot package install
    schemes: [bosbot, openmausbot]
  - name: Web links
    role: Viewer
    schemes: [http, https]

# In-app auto-update reads latest-mac.yml + the .zip (macOS) or latest.yml +
# the NSIS .exe (Windows) from the PUBLIC releases in this source repo.
# Public → no token on users' machines. Baked into
# app-update.yml; both metadata files are emitted here even with
# --publish never, and must be uploaded to the GitHub release alongside the
# artifacts — a release missing latest.yml leaves every Windows install
# stranded on its installed version.
publish:
  - provider: github
    owner: ferazfhansurie
    repo: bos-bot

directories:
  buildResources: build
  output: release

# electron-builder makes copied directories group-writable by default. The
# Linux CUA trust boundary requires root-owned package ancestors to be 0755.
afterPack: ./scripts/after-pack.mjs

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - electron/**
  - "!electron/**/*.test.*"
  - "!electron/resources/speech-helper"
  - "!electron/resources/speech-helper.swift"
  - "!electron/resources/speech-helper-Info.plist"
  - "!electron/resources/BOS Bot Speech.app/**"
  - "!electron/resources/notch-helper"
  - "!electron/resources/notch-helper.swift"
  # The Teach a skill recorder is gone, but a machine that once ran
  # `pnpm build:recorder` may still hold its helper build; never ship it.
  - "!electron/resources/recorder-helper"
  - "!electron/resources/recorder-helper.swift"
  - "!electron/resources/recorder-helper-Info.plist"
  - "!electron/resources/BOS Bot Recorder.app/**"
  # updater/preflight.py ships via mac.extraResources (it must be a real file
  # python can run, not an asar entry); keep it out of the archive.
  - "!electron/resources/updater/**"
  - "!**/node_modules/**"
  - package.json

asar: true

extraResources:
  - from: NOTICE
    to: NOTICE
  # Ship the app's own license terms in every desktop distribution.
  - from: LICENSE
    to: licenses/BOS-Bot-LICENSE.txt
  - from: NOTICE
    to: licenses/BOS-Bot-NOTICE.txt
  # cloudflared is distributed under Apache-2.0 as a separate executable.
  # BOS Bot itself uses the same full license text; ship another named
  # copy so the third-party executable's terms remain unambiguous.
  - from: LICENSE
    to: licenses/cloudflared-LICENSE.txt
  - from: third_party/cloudflared/README.md
    to: licenses/cloudflared-README.md
  - from: third_party/hpke-js/core-LICENSE.txt
    to: licenses/hpke-core-LICENSE.txt
  - from: third_party/hpke-js/common-LICENSE.txt
    to: licenses/hpke-common-LICENSE.txt
  - from: dist
    to: ui
  - from: dist-server
    to: server
  # the companion sidecar — a separate process because it is the only part
  # of the app that listens off this machine, and it stays off until asked
  - from: dist-companion
    to: companion
  - from: skills
    to: skills
  - from: dist-native/android-platform-tools
    to: android-platform-tools

mac:
  # Refresh the digest after nested native signing, before sealing the app.
  sign: ./scripts/mac-sign.mjs
  # Two single-arch artifacts rather than one universal binary: the app is
  # architecture-specific, and universal would make users download both halves.
  # electron-updater picks by filename (arm64-marked files on Apple silicon,
  # unmarked ones on Intel), so latest-mac.yml must list all four files.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # the dictation helper is a signed background app — Windows and Linux never see it
  extraResources:
    - from: electron/resources/BOS Bot Speech.app
      to: BOS Bot Speech.app
    # notch geometry + drag sensor (electron/notch.mjs); a plain universal binary
    - from: electron/resources/notch-helper
      to: notch-helper
    # CUA must live outside ASAR. prepare-cua stages the signed executable and
    # a self-contained JS/native SDK bundle selected for macOS arm64.
    # ${arch} resolves per built arch — each bundle carries its own natives
    - from: dist-native/${arch}/cua-driver
      to: cua-driver
    - from: dist-native/${arch}/cua-sdk
      to: cua-sdk
    - from: dist-native/cloudflared/darwin-${arch}/cloudflared
      to: cloudflared/cloudflared
    - from: dist-native/browser/darwin-${arch}
      to: browser-engine
    # read-only launchd/health preflight the 1.3 updater runs before it admits
    # an update or restart (server/updater.ts createDarwinExecutor). Lands at
    # Contents/Resources/updater/preflight.py; a packaged build refuses to
    # update when it is missing.
    - from: electron/resources/updater/preflight.py
      to: updater/preflight.py
    # no-downgrade guard the updater runs on the staged bundle right after the
    # preflight: stamped, newer than the running build, on release, the prod
    # head. after-pack.mjs writes the stamp it reads (Resources/build-commit.json).
    - from: electron/resources/updater/no-downgrade.py
      to: updater/no-downgrade.py
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes: [public.html, public.xhtml]
    NSCameraUsageDescription: BOS Bot uses the camera only when you allow a website to access it.
    NSMicrophoneUsageDescription: BOS Bot uses the microphone for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: BOS Bot transcribes your voice on-device to type messages for you.
    NSAccessibilityUsageDescription: BOS Bot uses Accessibility only when you explicitly let a bot control this Mac.
    NSScreenCaptureUsageDescription: BOS Bot uses Screen Recording so approved bots can see this Mac before acting.
  # Notarization runs manually after the build (notarytool + staple),
  # mirroring the BlueyLite ship_release.sh flow.
  notarize: false

dmg:
  sign: true
  # ${arch} is load-bearing: without it the x64 dmg silently overwrites
  # the arm64 one when both arches build (this section overrides both the
  # top-level and mac-level artifactName, so it must carry the arch itself)
  artifactName: BOS-Bot-${version}-${arch}.dmg

win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  icon: build/icon.ico
  extraResources:
    - from: dist-native/cloudflared/win32-x64/cloudflared.exe
      to: cloudflared/cloudflared.exe
    - from: dist-native/browser/win32-x64
      to: browser-engine
    # CUA driver and SDK for Windows — must live outside ASAR for native modules
    - from: dist-native/cua-win32-x64/cua-driver.exe
      to: cua-driver.exe
    - from: dist-native/cua-win32-x64/cua-sdk
      to: cua-sdk
    # Electron-independent owner for server-only installs (no Electron UI);
    # verifies cua-sdk/manifest.json before loading the staged SDK.
    - from: electron/windows-cua-host.mjs
      to: cua-host/windows-cua-host.mjs
  # Ordinary staging remains update-free. Live packaging (live.cjs) either
  # signs (forceCodeSigning, stable publisher, update signature verification)
  # or, with BOS_WINDOWS_SIGNING=unsigned (1.0 alpha), ships unsigned with no
  # publisherName so electron-updater can still install updates.

nsis:
  oneClick: true
  perMachine: false
  shortcutName: BOS Bot
  # Versioned, like the .dmg. The README's /latest/download/ button needs a
  # STABLE filename, so ship a second copy named BOS-Bot-setup.exe on the
  # release — the same trick as BOS-Bot.dmg beside BOS-Bot-${version}.dmg.
  artifactName: BOS-Bot-${version}-setup.${ext}

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # Keep the vector source in the freedesktop scalable icon hierarchy. A
  # lone 1024px PNG is not indexed by GNOME's hicolor theme on Ubuntu 24.04.
  icon: build/icon.svg
  category: Utility
  executableName: bos-bot
  synopsis: Your local multi-model AI desktop
  description: A private local-first desktop for Claude and Codex.
  maintainer: Milind Soni <46266943+milind-soni@users.noreply.github.com>
  vendor: BOS
  syncDesktopName: true
  # The reviewed x64 CLI runtime is staged before packaging and remains
  # outside ASAR so executable modes and adjacent sidecars are preserved.
  extraResources:
    - from: dist-native/cua-linux-x64
      to: cua-linux-x64
    - from: dist-native/cloudflared/linux-x64/cloudflared
      to: cloudflared/cloudflared
    - from: dist-native/browser/linux-x64
      to: browser-engine
    - from: build/linux-openmausbot-browser.apparmor
      to: bos-bot-browser.apparmor
  desktop:
    entry:
      Name: BOS Bot
      Comment: Your own team of AI bots, in a chat app
      Keywords: AI;Agents;Chat;Productivity;

deb:
  packageCategory: utils
  priority: optional
  # Add the narrow browser policy's parser without replacing Electron's
  # default shared-library dependencies.
  fpm: ["--depends", "apparmor"]
  # dpkg can preserve legacy directory modes during an upgrade. This
  # idempotent hook repairs only the exact package-owned CUA path.
  afterInstall: build/linux-after-install.sh
  afterRemove: build/linux-after-remove.sh

# Static AppImage runtime: Ubuntu 24.04 can launch it without legacy FUSE 2.
toolsets:
  appimage: "1.0.3"
# branding compatibility (electron/branding-compat.json): peer-http: HTTP authentication headers, discovery and domain verification still interoperate with 1.9.1; escaped-links: escaped link parsers and desktop scheme registration keep accepting saved links
