name: ${COMPOSE_PROJECT_NAME:-bosbot}
services:
  omb:
    init: true
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${BOS_BASE_IMAGE:-ghcr.io/milind-soni/openmausbot:latest}
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex}
    image: ${BOS_LOCAL_IMAGE:-bosbot-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${BOS_BIND_ADDRESS:-127.0.0.1}:${BOS_HTTP_PORT:-8080}:80"
    environment:
      BOS_PORT: "8799"
      BOS_WEBHOOK_PORT: "8800"
      BOS_PUBLIC_URL: ${BOS_PUBLIC_URL:-http://localhost:${BOS_HTTP_PORT:-8080}}
      BOS_WEBHOOK_PUBLIC_URL: ${BOS_WEBHOOK_PUBLIC_URL:-${BOS_PUBLIC_URL:-http://localhost:${BOS_HTTP_PORT:-8080}}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('bosbot')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:omb
    environment:
      BOS_HTTPS_HOST: ${BOS_HTTPS_HOST:-}
      BOS_BIND_ADDRESS: ${BOS_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export BOS_UPSTREAM_SCHEME=http
        if [ -n "$$BOS_HTTPS_HOST" ] && [ "$$BOS_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "BOS_HTTPS_HOST requires BOS_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$BOS_HTTPS_HOST" ]; then
          export BOS_UPSTREAM_SCHEME=https
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      omb:
        condition: service_healthy
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${BOS_DATA_EXTERNAL:-false}
    name: ${BOS_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-bosbot}_data}
  caddy_data:
  caddy_config:
# branding compatibility (electron/branding-compat.json): pairing: old QR codes remain readable; server emission stays old until both native apps have shipped support; ipc: IPC and updater restart arguments preserve mixed-version desktop recovery
