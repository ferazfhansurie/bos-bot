extends: ./electron-builder.yml
appId: ai.bos.bot.staging
productName: BOS Staging
artifactName: BOS-Staging-${version}-${arch}.${ext}
extraMetadata:
  bosChannel: staging
  name: bos-staging
  desktopName: ai.bos.bot.staging.desktop
protocols:
  - name: BOS Staging package install
    schemes:
      - bosbot-staging
publish: null
directories:
  output: release-staging
nsis:
  shortcutName: BOS Staging
  artifactName: BOS-Staging-${version}-setup.${ext}
dmg:
  artifactName: BOS-Staging-${version}-${arch}.dmg
linux:
  executableName: bos-staging
  desktop:
    entry:
      Name: BOS Staging
  extraResources:
    - from: dist-native/cua-linux-x64
      to: cua-linux-x64
    - from: dist-native/cloudflared/linux-x64/cloudflared
      to: cloudflared/cloudflared
    - from: dist-native/browser/linux-x64
      to: browser-engine
    - from: build/linux-bos-staging-browser.apparmor
      to: bos-staging-browser.apparmor
deb:
  afterInstall: build/linux-after-install.staging.sh
  afterRemove: build/linux-after-remove.staging.sh
