<script>
(() => {
  // Timeline (seconds). One source of truth for the live splash and the rendered video.
  const INTRO = 2.45, EXIT = 0.4, TOTAL = INTRO + EXIT;

  const spring = (t, w, z) => {
    if (t <= 0) return 0;
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
  };
  const vel = (t, w, z) => (spring(t + 0.004, w, z) - spring(t - 0.004, w, z)) / 0.008 / w;
  const bump = (t, d) => (t <= 0 || t >= d ? 0 : Math.sin(Math.PI * t / d));
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
  const lerp = (a, b, p) => a + (b - a) * p;

  // origin = pivot point in art space (bottom-centre of each character).
  const C = {
    cloud:    { o: [624, 606],  at: 0.06, w: 13, z: 0.42, from: { ty: 70, r: -6, s: 0 },    squash: 0.16 },
    blueguy:  { o: [370, 994],  at: 0.30, w: 11, z: 0.55, from: { ty: 320, r: -12, s: 0.9 } },
    pinkgirl: { o: [860, 1114], at: 0.40, w: 11, z: 0.55, from: { ty: 320, r: 12, s: 0.9 } },
    green:    { o: [288, 545],  at: 0.52, w: 17, z: 0.40, from: { tx: 70, ty: 40, s: 0 },   squash: 0.22 },
    purple:   { o: [959, 563],  at: 0.60, w: 17, z: 0.40, from: { tx: -70, ty: 40, s: 0 },  squash: 0.22 },
    orange:   { o: [552, 1068], at: 0.74, w: 19, z: 0.34, from: { ty: 30, s: 0 },           squash: 0.28 },
  };
  const HOP = { cloud: [1.10, 16, 0.44], green: [1.28, 22, 0.32], purple: [1.36, 22, 0.32], orange: [1.44, 20, 0.30] };
  const BLINK = { cloud: 1.62, blueguy: 1.72, pinkgirl: 1.78, green: 1.86, purple: 1.9, orange: 1.94 };

  const $ = id => document.getElementById(id);
  const els = {}, eyes = {};
  for (const k in C) {
    els[k] = $('bs-' + k);
    eyes[k] = [...els[k].querySelectorAll('.eye')].map(p => { const b = p.getBBox(); return [p, b.x + b.width / 2, b.y + b.height / 2]; });
  }
  const all = $('bs-all'), word = $('bs-word');

  function render(t) {
    for (const k in C) {
      const c = C[k], f = c.from, lt = t - c.at, p = spring(lt, c.w, c.z);
      let tx = lerp(f.tx || 0, 0, p), ty = lerp(f.ty || 0, 0, p), r = lerp(f.r || 0, 0, p);
      const s = lerp(f.s ?? 1, 1, p);
      let sx = s, sy = s;
      if (c.squash) { const v = vel(lt, c.w, c.z) * c.squash; sx *= 1 - v * 0.5; sy *= 1 + v; }
      // cheek-to-cheek nudge once both heads have landed
      const n = bump(t - 1.18, 0.5);
      if (k === 'blueguy') { r += 3.5 * n; ty -= 8 * n; }
      if (k === 'pinkgirl') { r -= 3.5 * n; ty -= 8 * n; }
      if (HOP[k]) { const [h0, amp, d] = HOP[k], hb = bump(t - h0, d); ty -= amp * hb; sy *= 1 + 0.05 * hb; sx *= 1 - 0.03 * hb; }
      const [ox, oy] = c.o, el = els[k];
      el.setAttribute('transform', `translate(${ox + tx} ${oy + ty}) rotate(${r}) scale(${Math.max(sx, 0.0001)} ${Math.max(sy, 0.0001)}) translate(${-ox} ${-oy})`);
      el.style.opacity = clamp01(lt / 0.08);
      const bl = 1 - 0.9 * bump(t - BLINK[k], 0.17);
      for (const [e, cx, cy] of eyes[k]) e.setAttribute('transform', `translate(${cx} ${cy}) scale(1 ${bl}) translate(${-cx} ${-cy})`);
    }
    const wt = t - 1.02;
    word.style.opacity = smooth(wt / 0.45);
    word.setAttribute('transform', `translate(0 ${lerp(26, 0, spring(wt, 10, 0.8))})`);
    // exit: gentle push-in + fade
    const e = t <= INTRO ? 0 : Math.pow(clamp01((t - INTRO) / EXIT), 3), sc = 1 + 0.07 * e;
    const exitTf = `translate(627 700) scale(${sc}) translate(-627 -700)`;
    all.setAttribute('transform', exitTf);
    word.parentNode.style.opacity = 1 - e;
  }

  const q = new URLSearchParams(location.search);
  if (q.has('t')) { render(parseFloat(q.get('t'))); document.documentElement.dataset.ready = '1'; return; }

  const hold = q.has('hold');             // ?hold → stop after intro; host calls BosSplash.exit()
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // reduced motion: start on the final pose, short hold, then fade out
  const offset = reduce ? INTRO : 0;
  let start = null, exitAt = hold ? Infinity : INTRO + (reduce ? 0.8 : 0), done = false;
  const finish = () => {
    if (done) return; done = true;
    window.dispatchEvent(new Event('bos-splash-done'));
    try { window.parent !== window && window.parent.postMessage('bos-splash-done', '*'); } catch {}
  };
  const elapsed = () => offset + (performance.now() - start) / 1000;
  function frame(now) {
    if (start === null) start = now;
    const raw = elapsed();
    const t = raw < INTRO ? raw : raw < exitAt ? INTRO : INTRO + (raw - exitAt);
    render(Math.min(t, TOTAL));
    if (t >= TOTAL) return finish();
    requestAnimationFrame(frame);
  }
  window.BosSplash = {
    duration: TOTAL,
    exit() { if (exitAt === Infinity) exitAt = Math.max(INTRO, start === null ? INTRO : elapsed()); },
  };
  render(0);
  requestAnimationFrame(frame);
})();
</script>
