<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOS</title>
<style>
  /* BOS launch splash. ~2.45s intro + 0.4s exit. Self-contained: no assets, no network. */
  :root { --bs-bg: #0D0D0D; }
  html, body { margin: 0; height: 100%; background: var(--bs-bg); overflow: hidden; }
  .bs-stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .bs-art { width: min(74vmin, 480px); height: auto; overflow: visible; transform: translateY(-3vh); }
  #bs-word { fill: #fff; font: 700 104px -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif; letter-spacing: -2px; }
  .bs-art .c, .bs-art .h, #bs-word, #bs-fill, #bs-front { opacity: 0; }
  .ink { fill: #0E0E0E; }
  .ln { fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="bs-stage"><svg class="bs-art" viewBox="0 0 1024 1150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs>
  <linearGradient id="bs-rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#B69CFF"/><stop offset="0.45" stop-color="#6D6BFF"/><stop offset="0.75" stop-color="#3FB6FF"/><stop offset="1" stop-color="#F472B6"/>
  </linearGradient>
  <linearGradient id="bs-glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1D1931"/><stop offset="1" stop-color="#110F1C"/>
  </linearGradient>
  <linearGradient id="bs-lipg" gradientUnits="userSpaceOnUse" x1="142" y1="0" x2="882" y2="0">
    <stop offset="0" stop-color="#8F7BFF"/><stop offset="0.5" stop-color="#5FA8FF"/><stop offset="1" stop-color="#C78BFF"/>
  </linearGradient>
  <path id="bs-shape" d="M280 230H744A150 150 0 0 1 894 380V640A150 150 0 0 1 744 790H430L255 890L305 790H280A150 150 0 0 1 130 640V380A150 150 0 0 1 280 230Z"/>
  <clipPath id="bs-back"><rect x="-200" y="-200" width="1424" height="436"/></clipPath>
  <clipPath id="bs-in"><rect x="-200" y="-200" width="1424" height="852"/></clipPath>
  <clipPath id="bs-low"><rect x="-200" y="640" width="1424" height="600"/></clipPath>
</defs>
<g id="bs-all">
  <g id="bs-bubble">
    <use id="bs-fill" href="#bs-shape" fill="#14111F"/>
    <g clip-path="url(#bs-back)">
      <g class="c" id="bs-purple"><g>
        <rect x="300" y="140" width="160" height="170" rx="48" fill="#9B5CF0"/>
        <rect class="eye ink" x="345" y="180" width="20" height="40" rx="10"/><rect class="eye ink" x="400" y="180" width="20" height="40" rx="10"/>
      </g></g>
      <g class="c" id="bs-green"><g>
        <path fill="#19D39A" d="M492 320C490 210 525 142 585 142C640 142 662 188 690 228C708 255 690 320 668 320Z"/>
        <rect class="eye ink" x="555" y="172" width="20" height="40" rx="10"/><rect class="eye ink" x="608" y="172" width="20" height="40" rx="10"/>
      </g></g>
    </g>
    <use id="bs-line" href="#bs-shape" fill="none" stroke="url(#bs-rim)" stroke-width="20" stroke-linejoin="round" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/>
    <g clip-path="url(#bs-in)">
      <g class="c" id="bs-putri"><g>
        <path fill="#F5E6CC" d="M578 480C520 400 556 262 680 240C805 222 884 300 878 432C875 505 902 560 888 612C852 594 830 530 818 482C790 470 610 470 578 480Z"/>
        <circle cx="700" cy="385" r="112" fill="#F2508F"/>
        <ellipse cx="808" cy="450" rx="20" ry="14" fill="#FF86B0"/>
        <path fill="#F5E6CC" d="M588 372C598 272 700 242 795 282C766 304 724 304 694 292C672 326 632 352 588 372Z"/>
        <path fill="#F5E6CC" d="M798 300C846 362 856 452 834 528C818 474 812 424 790 384Z"/>
        <g class="ln" stroke="#FFFFFF" stroke-width="12" transform="rotate(8 702 385)">
          <rect x="612" y="348" width="80" height="62" rx="22"/><rect x="712" y="348" width="80" height="62" rx="22"/><path d="M692 372H712"/>
        </g>
        <rect class="eye ink" x="645" y="358" width="18" height="36" rx="9"/><rect class="eye ink" x="742" y="372" width="18" height="36" rx="9"/>
        <path class="ln" stroke="#0E0E0E" stroke-width="9" d="M680 444Q702 460 726 444"/>
      </g></g>
      <g class="c" id="bs-firaz"><g>
        <g fill="#1C1C1C">
          <circle cx="252" cy="365" r="62"/><circle cx="322" cy="322" r="62"/><circle cx="396" cy="330" r="56"/><circle cx="445" cy="378" r="44"/>
          <circle cx="200" cy="425" r="56"/><circle cx="186" cy="494" r="46"/>
        </g>
        <circle cx="335" cy="482" r="125" fill="#1677FF"/>
        <circle cx="208" cy="528" r="30" fill="#1677FF"/>
        <g class="ln" stroke="#FFFFFF" stroke-width="12" transform="rotate(-8 340 462)">
          <rect x="242" y="430" width="86" height="64" rx="22"/><rect x="350" y="430" width="86" height="64" rx="22"/><path d="M328 455H350"/>
        </g>
        <rect class="eye ink" x="276" y="452" width="18" height="38" rx="9"/><rect class="eye ink" x="384" y="438" width="18" height="38" rx="9"/>
        <path class="ln" stroke="#0E0E0E" stroke-width="9" d="M352 532Q378 548 404 524"/>
      </g></g>
      <g class="c" id="bs-bos"><g>
        <circle cx="540" cy="548" r="160" fill="#FFFFFF"/>
        <g class="eye" transform="rotate(10 480 568)"><path class="ln" stroke="#0E0E0E" stroke-width="15" d="M480 542V594M454 568H506"/></g>
        <g class="eye" transform="rotate(10 602 580)"><path class="ln" stroke="#0E0E0E" stroke-width="15" d="M602 554V606M576 580H628"/></g>
      </g></g>
      <g class="c" id="bs-orange"><g>
        <circle cx="765" cy="642" r="62" fill="#FF9F1C"/>
        <rect class="eye ink" x="740" y="610" width="16" height="30" rx="8"/><rect class="eye ink" x="776" y="610" width="16" height="30" rx="8"/>
      </g></g>
    </g>
    <g id="bs-front" clip-path="url(#bs-low)"><use href="#bs-shape" fill="url(#bs-glass)" stroke="url(#bs-rim)" stroke-width="20" stroke-linejoin="round"/></g>
    <path id="bs-lip" class="ln" stroke="url(#bs-lipg)" stroke-width="14" d="M142 640H882" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/>
    <g class="h" data-o="380 238" data-for="purple"><path fill="#9B5CF0" d="M344 246C344 212 416 212 416 246Z"/></g>
    <g class="h" data-o="516 238" data-for="green"><path fill="#19D39A" d="M484 246C484 214 548 214 548 246Z"/></g>
    <g class="h" data-o="270 642" data-for="firaz"><path fill="#1677FF" d="M226 650C226 606 314 606 314 650Z"/></g>
    <g class="h" data-o="886 536" data-for="putri"><path fill="#F2508F" d="M896 498C852 498 852 574 896 574Z"/></g>
    <g class="h" data-o="420 642" data-for="bos"><path fill="#FFFFFF" d="M370 652C370 600 470 600 470 652Z"/></g>
    <g class="h" data-o="660 642" data-for="bos"><path fill="#FFFFFF" d="M610 652C610 600 710 600 710 652Z"/></g>
    <g class="h" data-o="838 642" data-for="orange"><path fill="#FF9F1C" d="M812 650C812 620 864 620 864 650Z"/></g>
  </g>
</g>
<text id="bs-word" x="512" y="1060" text-anchor="middle">BOS</text>
</svg></div>
<script>
(() => {
  // Timeline (seconds). One source of truth for the live splash and the rendered frames (?t=).
  const INTRO = 2.45, EXIT = 0.4, TOTAL = INTRO + EXIT;

  const spring = (t, w, z) => {
    if (t <= 0) return 0;
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
  };
  const vel = (t, w, z) => (spring(t + 0.004, w, z) - spring(t - 0.004, w, z)) / 0.008 / w;
  const bump = (t, d) => (t <= 0 || t >= d ? 0 : Math.sin(Math.PI * t / d));
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
  const lerp = (a, b, p) => a + (b - a) * p;

  // Bubble draws in, then the squad peeks up over the rim one by one; bos lands last, in the centre.
  // o = pivot on the rim the character rises from.
  const C = {
    purple: { o: [380, 238], at: 0.40, w: 15, z: 0.42, from: { ty: 130 }, squash: 0.18 },
    green:  { o: [585, 238], at: 0.50, w: 15, z: 0.42, from: { ty: 130 }, squash: 0.18 },
    firaz:  { o: [335, 640], at: 0.62, w: 11, z: 0.55, from: { ty: 330, r: -10 } },
    putri:  { o: [700, 640], at: 0.72, w: 11, z: 0.55, from: { ty: 330, r: 10 } },
    orange: { o: [765, 640], at: 0.86, w: 18, z: 0.36, from: { ty: 140 }, squash: 0.26 },
    bos:    { o: [540, 640], at: 1.02, w: 12, z: 0.40, from: { ty: 340, s: 0.9 }, squash: 0.14 },
  };
  const HOP = { purple: [1.30, 14, 0.30], green: [1.36, 14, 0.30], orange: [1.46, 16, 0.28], bos: [1.58, 18, 0.40] };
  const BLINK = { purple: 1.62, green: 1.68, firaz: 1.74, putri: 1.80, orange: 1.86, bos: 2.0 };

  const $ = id => document.getElementById(id);
  const els = {}, eyes = {};
  for (const k in C) {
    els[k] = $('bs-' + k);
    eyes[k] = [...els[k].querySelectorAll('.eye')].map(p => { const b = p.getBBox(); return [p, b.x + b.width / 2, b.y + b.height / 2, p.getAttribute('transform') || '']; });
  }
  const hands = [...document.querySelectorAll('.bs-art .h')].map(el => ({ el, k: el.dataset.for, o: el.dataset.o.split(' ').map(Number) }));
  const all = $('bs-all'), bubble = $('bs-bubble'), line = $('bs-line'), lip = $('bs-lip'), fill = $('bs-fill'), front = $('bs-front'), word = $('bs-word');

  function render(t) {
    // bubble: outline draws, glass fills in, lip draws across
    const bp = spring(t, 9, 0.6), bs = lerp(0.86, 1, bp);
    bubble.setAttribute('transform', `translate(512 560) scale(${bs}) translate(-512 -560)`);
    line.setAttribute('stroke-dashoffset', 1000 * (1 - smooth(t / 0.6)));
    fill.style.opacity = smooth((t - 0.15) / 0.4);
    front.style.opacity = smooth((t - 0.3) / 0.3);
    lip.setAttribute('stroke-dashoffset', 1000 * (1 - smooth((t - 0.32) / 0.35)));

    for (const k in C) {
      const c = C[k], f = c.from, lt = t - c.at, p = spring(lt, c.w, c.z);
      let ty = lerp(f.ty || 0, 0, p), r = lerp(f.r || 0, 0, p);
      const s = lerp(f.s ?? 1, 1, p);
      let sx = s, sy = s;
      if (c.squash) { const v = vel(lt, c.w, c.z) * c.squash; sx *= 1 - v * 0.5; sy *= 1 + v; }
      // firaz and putri lean in once both have landed
      const n = bump(t - 1.2, 0.5);
      if (k === 'firaz') r += 3.5 * n;
      if (k === 'putri') r -= 3.5 * n;
      if (HOP[k]) { const [h0, amp, d] = HOP[k], hb = bump(t - h0, d); ty -= amp * hb; sy *= 1 + 0.05 * hb; sx *= 1 - 0.03 * hb; }
      const [ox, oy] = c.o, el = els[k];
      el.setAttribute('transform', `translate(${ox} ${oy + ty}) rotate(${r}) scale(${Math.max(sx, 0.0001)} ${Math.max(sy, 0.0001)}) translate(${-ox} ${-oy})`);
      el.style.opacity = clamp01(lt / 0.06);
      const bl = 1 - 0.9 * bump(t - BLINK[k], 0.17);
      for (const [e, cx, cy, base] of eyes[k]) e.setAttribute('transform', `translate(${cx} ${cy}) scale(1 ${bl}) translate(${-cx} ${-cy}) ${base}`);
    }
    // hands land on the rim just after their owner
    for (const h of hands) {
      const lt = t - C[h.k].at - 0.16, p = spring(lt, 18, 0.45), [ox, oy] = h.o;
      h.el.setAttribute('transform', `translate(${ox} ${oy}) scale(${Math.max(p, 0.0001)}) translate(${-ox} ${-oy})`);
      h.el.style.opacity = clamp01(lt / 0.05);
    }
    const wt = t - 1.25;
    word.style.opacity = smooth(wt / 0.45);
    word.setAttribute('transform', `translate(0 ${lerp(26, 0, spring(wt, 10, 0.8))})`);
    // exit: gentle push-in + fade
    const e = t <= INTRO ? 0 : Math.pow(clamp01((t - INTRO) / EXIT), 3), sc = 1 + 0.07 * e;
    all.setAttribute('transform', `translate(512 560) scale(${sc}) translate(-512 -560)`);
    word.parentNode.style.opacity = 1 - e;
  }

  const q = new URLSearchParams(location.search);
  if (q.has('t')) { render(parseFloat(q.get('t'))); document.documentElement.dataset.ready = '1'; return; }

  const hold = q.has('hold');             // ?hold → stop after intro; host calls BosSplash.exit()
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // reduced motion: start on the final pose, short hold, then fade out
  const offset = reduce ? INTRO : 0;
  let start = null, exitAt = hold ? Infinity : INTRO + (reduce ? 0.8 : 0), done = false;
  const finish = () => {
    if (done) return; done = true;
    window.dispatchEvent(new Event('bos-splash-done'));
    try { window.parent !== window && window.parent.postMessage('bos-splash-done', '*'); } catch {}
  };
  const elapsed = () => offset + (performance.now() - start) / 1000;
  function frame(now) {
    if (start === null) start = now;
    const raw = elapsed();
    const t = raw < INTRO ? raw : raw < exitAt ? INTRO : INTRO + (raw - exitAt);
    render(Math.min(t, TOTAL));
    if (t >= TOTAL) return finish();
    requestAnimationFrame(frame);
  }
  window.BosSplash = {
    duration: TOTAL,
    exit() { if (exitAt === Infinity) exitAt = Math.max(INTRO, start === null ? INTRO : elapsed()); },
  };
  render(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
