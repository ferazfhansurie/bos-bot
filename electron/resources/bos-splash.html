<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOS</title>
<style>
  /* BOS launch splash: your own bots spring up, smile, and lift away. Mirrors
     ios/App/LaunchSplashView.swift. Self-contained: no assets, no network. */
  html, body { margin: 0; height: 100%; background: #0D0D0D; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .group { display: flex; flex-direction: column; align-items: center; gap: 28px; transform-origin: 50% 50%; }
  .squad { position: relative; width: 360px; height: 104px; }
  .squad img { position: absolute; bottom: 0; left: 50%; display: block; transform-origin: 50% 100%; opacity: 0; will-change: transform, opacity, filter; }
  .word { color: #fff; font: 700 30px -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif; letter-spacing: -0.5px; opacity: 0; }
</style>
</head>
<body>
<div class="stage"><div class="group" id="group" aria-hidden="true"><div class="squad" id="squad"></div><div class="word" id="word">BOS</div></div></div>
<script>
(() => {
  // Timeline (seconds), shared by the live splash and rendered frames (?t=).
  const SMILE = 0.62, INTRO = 1.04, EXIT = 0.42, TOTAL = INTRO + EXIT;
  // squad=[{idle,happy}] from the app (src/lib/launch-splash.ts); a lone white bos before the first run
  const FALLBACK = [{"idle": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"-20 -20 140 140\"><path d=\"M 50 10 C 72 10 90 28 90 50 C 90 72 72 90 50 90 C 28 90 10 72 10 50 C 10 28 28 10 50 10 Z\" fill=\"#FFFFFF\"/><g transform=\"rotate(-12 50 50)\"><g transform=\"translate(16.4 38) scale(1.333)\"><path d=\"M4.5 12L19.5 12\" fill=\"none\" stroke=\"#000000\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g transform=\"translate(51.6 38) scale(1.333)\"><path d=\"M4.5 12L19.5 12\" fill=\"none\" stroke=\"#000000\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g></g></svg>", "happy": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"-20 -20 140 140\"><path d=\"M 50 10 C 72 10 90 28 90 50 C 90 72 72 90 50 90 C 28 90 10 72 10 50 C 10 28 28 10 50 10 Z\" fill=\"#FFFFFF\"/><g transform=\"rotate(-12 50 50)\"><g transform=\"translate(16.4 38) scale(1.333)\"><path d=\"M12 4L12 20M5.07 8L18.93 16M5.07 16L18.93 8\" fill=\"none\" stroke=\"#000000\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g transform=\"translate(51.6 38) scale(1.333)\"><path d=\"M12 4L12 20M5.07 8L18.93 16M5.07 16L18.93 8\" fill=\"none\" stroke=\"#000000\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g></g><g transform=\"translate(83.6 -12.4) scale(1.733)\"><path d=\"M12 20C12 20 3.5 15 3.5 9.2C3.5 6.4 5.6 4.4 8.1 4.4C9.9 4.4 11.3 5.4 12 6.9C12.7 5.4 14.1 4.4 15.9 4.4C18.4 4.4 20.5 6.4 20.5 9.2C20.5 15 12 20 12 20Z\" fill=\"none\" stroke=\"#FCFCFC\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g></svg>"}];

  const q = new URLSearchParams(location.search);
  let squad = FALLBACK;
  try { const s = JSON.parse(q.get('squad') || 'null'); if (Array.isArray(s) && s.length) squad = s.slice(0, 5); } catch {}

  const clamp01 = x => Math.max(0, Math.min(1, x));
  const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
  const lerp = (a, b, p) => a + (b - a) * p;
  // SwiftUI .spring(duration: 0.55, bounce: 0.32)
  const W = 2 * Math.PI / 0.55, Z = 0.68, WD = W * Math.sqrt(1 - Z * Z);
  const spring = t => t <= 0 ? 0 : 1 - Math.exp(-Z * W * t) * (Math.cos(WD * t) + (Z * W / WD) * Math.sin(WD * t));
  const url = svg => 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);

  // chief in the middle; the rest alternate left and right, outer ones smaller and a step lower
  const host = document.getElementById('squad'), group = document.getElementById('group'), word = document.getElementById('word');
  const members = squad.map((m, i) => {
    const rank = i === 0 ? 0 : Math.floor((i - 1) / 2) + 1, side = i === 0 ? 0 : (i % 2 ? -1 : 1);
    const size = rank === 0 ? 96 : rank === 1 ? 64 : 48;
    // the svg is padded 20 units a side for the accent, so its box is 1.4x and
    // the body's foot sits 0.2x above the box's bottom edge
    const img = new Image(size * 1.4, size * 1.4);
    img.style.marginBottom = `${-size * 0.2}px`; img.style.transformOrigin = `50% calc(100% - ${size * 0.2}px)`;
    img.alt = ''; img.src = url(m.idle);
    return { m, rank, size, img, x: side * (rank === 1 ? 74 : 128), y: rank === 0 ? 0 : rank === 1 ? -4 : -10, delay: (2 - rank) * 0.07, happy: false };
  });
  // outermost first so the middle one lands on top
  [...members].sort((a, b) => b.rank - a.rank).forEach(member => host.appendChild(member.img));

  function render(t) {
    for (const b of members) {
      const p = spring(t - b.delay);
      const smiling = b.rank < 2 && t >= SMILE;
      if (smiling !== b.happy) { b.happy = smiling; b.img.src = url(smiling ? b.m.happy : b.m.idle); }
      // the face swap squashes in, like the app's glyph faces
      const sq = smiling ? 1 - 0.12 * Math.sin(Math.PI * clamp01((t - SMILE) / 0.14)) : 1;
      const s = lerp(0.35, 1, p);
      b.img.style.transform = `translate(calc(-50% + ${b.x}px), ${b.y + lerp(36, 0, p)}px) scale(${s}, ${s * sq})`;
      b.img.style.opacity = clamp01(p * 1.6);
      b.img.style.filter = `blur(${Math.max(0, 6 * (1 - p)).toFixed(2)}px)`;
    }
    const w = smooth((t - 0.22) / 0.45);
    word.style.opacity = w;
    word.style.transform = `translateY(${lerp(10, 0, w)}px)`;
    // exit: the squad lifts towards you, softens and fades
    const e = t <= INTRO ? 0 : smooth((t - INTRO) / EXIT);
    group.style.transform = `translateY(-24px) scale(${1 + 0.12 * e})`;
    group.style.filter = e ? `blur(${8 * e}px)` : '';
    group.style.opacity = 1 - e;
  }

  if (q.has('t')) { render(parseFloat(q.get('t'))); document.documentElement.dataset.ready = '1'; return; }

  const hold = q.has('hold');             // ?hold: stop after the intro; the host calls BosSplash.exit()
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const offset = reduce ? INTRO : 0;      // reduced motion starts on the final pose
  let start = null, exitAt = hold ? Infinity : INTRO + (reduce ? 0.6 : 0), done = false;
  const finish = () => {
    if (done) return; done = true;
    window.dispatchEvent(new Event('bos-splash-done'));
    try { window.parent !== window && window.parent.postMessage('bos-splash-done', '*'); } catch {}
  };
  const elapsed = () => offset + (performance.now() - start) / 1000;
  function frame(now) {
    if (start === null) start = now;
    const raw = elapsed();
    const t = raw < INTRO ? raw : raw < exitAt ? INTRO : INTRO + (raw - exitAt);
    render(Math.min(t, TOTAL));
    if (t >= TOTAL) return finish();
    requestAnimationFrame(frame);
  }
  window.BosSplash = {
    duration: TOTAL,
    exit() { if (exitAt === Infinity) exitAt = Math.max(INTRO, start === null ? INTRO : elapsed()); },
  };
  render(offset);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
