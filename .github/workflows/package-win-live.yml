# Live Windows update artifacts, built on Windows from the pinned public source.
name: Package Windows Live
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact public source commit
        required: true
        type: string
permissions:
  contents: read
env:
  BOS_UPDATE_FEED_URL: https://bos.aihlete.com/updates
jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      BOS_WINDOWS_PUBLISHER: ${{ vars.BOS_WINDOWS_PUBLISHER }}
      # 1.0 ships an unsigned (alpha) Windows installer; set the repo variable
      # BOS_WINDOWS_SIGNING=signed once the 1.1 certificate is in place.
      BOS_WINDOWS_SIGNING: ${{ vars.BOS_WINDOWS_SIGNING || 'unsigned' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: git clean -fdX -- dist dist-server release
      - run: node scripts/release-contract.mjs check live win
      - run: pnpm package:prepare
      - run: pnpm build:cua:win
      # Keep the reviewed portable bundles; host-dependent esbuild labels
      # must not dirty the exact source commit before the package gate.
      - run: git restore electron/vendor/electron-updater.cjs electron/vendor/update-yaml.cjs
      - run: node scripts/release-contract.mjs package live win
      - name: "Gate: bundled browser works with an empty home"
        run: node scripts/smoke-browser-bundle.mjs --resources "${{ github.workspace }}/release/win-unpacked/resources"
      - name: "Gate: packaged Windows server discovers its browser"
        env:
          OMB_SMOKE_DIST: ${{ github.workspace }}/release/win-unpacked/resources/server
        run: node scripts/smoke-packaged-server.mjs --browser-bundle "${{ github.workspace }}/release/win-unpacked/resources/browser-engine"
      - name: Verify the packaged tree and update metadata
        shell: bash
        run: |
          res=release/win-unpacked/resources
          [ -f "$res/server/index.js" ] || { echo "::error::missing server/index.js"; exit 1; }
          [ -f "$res/ui/index.html" ] || { echo "::error::missing ui/index.html"; exit 1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || { echo "::error::missing cloudflared.exe"; exit 1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || { echo "::error::missing cloudflared license"; exit 1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || { echo "::error::missing cloudflared provenance"; exit 1; }
          expected=c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5
          actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
          [ "$actual" = "$expected" ] || { echo "::error::cloudflared hash is $actual"; exit 1; }
          "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.8.2 " || {
            echo "::error::cloudflared has the wrong version"; exit 1; }
          # feed owner/repo/url and publisherName are checked by the packaged release contract
          [ -f "$res/app-update.yml" ] || { echo "::error::missing app-update.yml"; exit 1; }
      - name: Verify Windows Authenticode trust and publisher
        if: env.BOS_WINDOWS_SIGNING == 'signed'
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid release signature: $($_.Name)" }
            $publisher = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($publisher -ne $env:BOS_WINDOWS_PUBLISHER) { throw "Release publisher differs from configured stable publisher" }
          }
      - name: Stable-named copy
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/BOS-Bot-$v-setup.exe" release/BOS-Bot-setup.exe
      - name: Verify packaged release contract
        run: node scripts/release-contract.mjs packaged live win "release/win-unpacked/resources"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/release-contract-win.json
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

