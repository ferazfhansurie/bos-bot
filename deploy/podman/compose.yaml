name: ${COMPOSE_PROJECT_NAME:-bosbot-podman}
services:
  omb:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/bosbot-podman:${BOS_IMAGE_TAG:-local}
    init: true
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${BOS_DATA_ROOT:?Run setup.sh first}:${BOS_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/omb-podman.sock
    environment:
      HOME: ${BOS_DATA_ROOT}
      BOS_DATA_DIR: ${BOS_DATA_ROOT}/.openmausbot
      BOS_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/omb-podman.sock
      BOS_PORT: ${BOS_PORT:-8799}
      BOS_WEBHOOK_PORT: ${BOS_WEBHOOK_PORT:-8800}
      BOS_PUBLIC_URL: ${BOS_PUBLIC_URL:-http://localhost:8080}
      BOS_WEBHOOK_PUBLIC_URL: ${BOS_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$BOS_PORT/api/health | grep -q bosbot']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      omb:
        condition: service_healthy
    environment:
      BOS_HTTP_PORT: ${BOS_HTTP_PORT:-8080}
      BOS_PORT: ${BOS_PORT:-8799}
      BOS_WEBHOOK_PORT: ${BOS_WEBHOOK_PORT:-8800}
      BOS_HTTPS_HOST: ${BOS_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
# branding compatibility (electron/branding-compat.json): data-home: existing desktop and companion homes, backups and lease recovery must open the same data
