# XcodeGen spec. The .xcodeproj is generated, not committed — a project
# file is a merge-conflict machine and nothing in it is worth reviewing.
#
#   brew install xcodegen && cd ios && xcodegen generate && open BosBot.xcodeproj
#
# XcodeGen is a development tool, not a dependency of the app: the app
# itself has none. If you'd rather not install it, make an iOS App target
# in Xcode by hand, add the App/ folder, and add the local CompanionCore
# package — the Info.plist keys below are the part that is easy to miss.
name: BosBot
options:
  bundleIdPrefix: com.aihlete
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CompanionCore:
    path: .

schemes:
  BosBot:
    build:
      targets:
        BosBot: all
        BosBotUITests: [test]
    test:
      config: Debug
      targets:
        - BosBotUITests

targets:
  BosBot:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: AppShared
      - path: Shared
    dependencies:
      - package: CompanionCore
        product: CompanionCore
      - target: BosBotWidgets
      - target: BosShareExtension
      - target: BosNotificationService
      - target: BosNotificationContent
    settings:
      base:
        DEVELOPMENT_TEAM: 4W9658Z948
        PRODUCT_BUNDLE_IDENTIFIER: com.aihlete.aios
        MARKETING_VERSION: "1.9.4"
        CURRENT_PROJECT_VERSION: "83"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The catalog lives in App/, which is already a source path.
        ASSETCATALOG_COMPILER_APPICON_NAME: JarvisCloudAppIcon
    entitlements:
      path: App/BosBot.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.communication: true
        com.apple.security.application-groups:
          - group.com.aihlete.aios.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.aihlete.aios
          - $(AppIdentifierPrefix)group.com.aihlete.aios.shared
    info:
      path: App/Info.plist
      properties:
        # What appears under the icon. Distinct from the desktop app on
        # purpose: someone may well have both, and two identical labels on
        # one person's devices is a small cruelty.
        CFBundleDisplayName: BOS Bot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSUserActivityTypes:
          - INSendMessageIntent
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        OpenMausKeychainAccessGroup: $(AppIdentifierPrefix)group.com.aihlete.aios.shared
        # The bot's Live Activity — its face and ask in the Dynamic Island
        # and on the lock screen.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.openmausbot.companion.pairing
            CFBundleURLSchemes:
              - openmausbot
              - bosbot
        # REQUIRED, and easy to lose. Without a launch screen iOS runs the
        # app in compatibility scaling: letterboxed inside black bars, with
        # everything drawn oversized, on every modern iPhone. An empty
        # dictionary is enough — it just has to exist.
        #
        # This cannot be an INFOPLIST_KEY_* build setting. Those are only
        # read when Xcode generates the Info.plist itself, and this target
        # supplies one, so they are silently ignored.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Without these two, NWBrowser returns no results at all — silently.
        # It looks exactly like "no computers on this network", which is a
        # confusing hour if you don't know to look here.
        NSLocalNetworkUsageDescription: >-
          BOS finds your computer on this network so your bots can
          reach you here.
        NSCameraUsageDescription: >-
          BOS uses the camera only to scan a pairing QR code shown on
          your computer.
        # a voice call keeps talking with the screen locked, like a phone call;
        # voip lets a bot's ring (PushKit) wake the app into a CallKit call
        UIBackgroundModes: [audio, voip]
        NSMicrophoneUsageDescription: >-
          BOS listens while you dictate a message to a bot or talk
          to one on a voice call.
        NSSpeechRecognitionUsageDescription: >-
          BOS converts your speech into text so you can send it
          to a bot. Recognition runs on this phone when it can.
        NSBonjourServices:
          - _openmausbot._tcp
        # The companion listener is plain HTTP on a local address. ATS has
        # to be told, and this is the narrowest way to say it: local
        # networking only, not a blanket exception.
        #
        # NSAllowsLocalNetworking covers the private ranges — 10/8,
        # 172.16/12, 192.168/16, .local — and that is the whole LAN story.
        # It does *not* cover Tailscale: a tailnet address lives in
        # 100.64.0.0/10, the CGNAT range, which ATS treats as ordinary
        # public internet and blocks over plain HTTP. The address cannot be
        # exempted (ATS exceptions are by name, not by subnet), but the
        # MagicDNS name can be, and every tailnet name ends in ts.net — so
        # connect by name and this one entry covers every machine you own.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true

  # Native navigation coverage uses bundled synthetic data and no pairing.
  BosBotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: BosBot
    settings:
      base:
        DEVELOPMENT_TEAM: 4W9658Z948
        PRODUCT_BUNDLE_IDENTIFIER: com.aihlete.aios.uitests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BosBot

  # Long-press a bot's notification: the bot itself, in the mood of what it
  # said, blinking and breathing above the message. Reads the bot's look
  # from the roster snapshot in the App Group.
  BosNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationContent
      - path: Shared/BotGlance.swift
      - path: AppShared/NotificationAvatarCache.swift
      - path: App/GlyphMark.swift
      - path: App/MausAvatar.swift
      - path: App/MausFaceData.swift
    dependencies:
      - package: CompanionCore
        product: CompanionCore
    settings:
      base:
        DEVELOPMENT_TEAM: 4W9658Z948
        PRODUCT_BUNDLE_IDENTIFIER: com.aihlete.aios.notification-content
        MARKETING_VERSION: "1.9.4"
        CURRENT_PROJECT_VERSION: "83"
        SWIFT_VERSION: "5.9"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
    entitlements:
      path: NotificationContent/NotificationContent.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aihlete.aios.shared
    info:
      path: NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: BOS Faces
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory:
              - BOS_BOT
              - OPENMAUS_UPDATE
              - OPENMAUS_APPROVAL
              - VOICE_WORK_DONE
            UNNotificationExtensionInitialContentSizeRatio: 0.36
            UNNotificationExtensionUserInteractionEnabled: true

  # The system share sheet can send a link, text, image, or document straight
  BosNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: AppShared/NotificationAvatarCache.swift
      - path: Shared/BotGlance.swift
    settings:
      base:
        DEVELOPMENT_TEAM: 4W9658Z948
        PRODUCT_BUNDLE_IDENTIFIER: com.aihlete.aios.notification-service
        MARKETING_VERSION: "1.9.4"
        CURRENT_PROJECT_VERSION: "83"
        SWIFT_VERSION: "5.9"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: true
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aihlete.aios.shared
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: BOS Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  # The system share sheet can send a link, text, image, or document straight
  # to a paired bot without first opening the containing app. Connection
  # metadata lives in the App Group; the bearer remains in the shared
  # Keychain access group.
  BosShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: AppShared
    dependencies:
      - package: CompanionCore
        product: CompanionCore
    settings:
      base:
        DEVELOPMENT_TEAM: 4W9658Z948
        PRODUCT_BUNDLE_IDENTIFIER: com.aihlete.aios.share
        MARKETING_VERSION: "1.9.4"
        CURRENT_PROJECT_VERSION: "83"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: true
    entitlements:
      path: ShareExtension/BosShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aihlete.aios.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.aihlete.aios.shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: BOS Bot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OpenMausKeychainAccessGroup: $(AppIdentifierPrefix)group.com.aihlete.aios.shared
        # ATS is evaluated for URLSession work performed by the extension too.
        # Mirror the containing app's narrow local/Tailscale exceptions so a
        # share can reach the same already-paired routes. Local-network privacy
        # usage text remains on the containing app, per Apple's extension rules.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsFileWithMaxCount: 4
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 4

  # The Live Activity lives in a widget extension. It shares the mascot's
  # drawing and data with the app, and the activity contract in Shared/.
  BosBotWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: App/MausAvatar.swift
      - path: App/MausFaceData.swift
      - path: App/GlyphMark.swift
    dependencies:
      # MausAvatar draws whichever body a bot wears, and the body catalog and
      # its path parser live in CompanionCore. The extension shares the
      # drawing with the app, so it has to share the catalog too.
      - package: CompanionCore
        product: CompanionCore
    settings:
      base:
        DEVELOPMENT_TEAM: 4W9658Z948
        PRODUCT_BUNDLE_IDENTIFIER: com.aihlete.aios.widgets
        MARKETING_VERSION: "1.9.4"
        CURRENT_PROJECT_VERSION: "83"
        SWIFT_VERSION: "5.9"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
    # the bots widget reads the roster snapshot the app writes here
    entitlements:
      path: Widgets/BosBotWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aihlete.aios.shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: BOS Bot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
# branding compatibility (electron/branding-compat.json): data-home: existing desktop and companion homes, backups and lease recovery must open the same data; keychain: existing paired and cloud credentials stay addressable, including the plist access-group selector; bonjour: old phone clients continue discovering the existing server service; pairing: old QR codes remain readable; server emission stays old until both native apps have shipped support
