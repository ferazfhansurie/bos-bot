# Gradle's default daemon heap is 512 MiB, which is not enough to merge this
# app's dex: the bundled ML Kit barcode model pushes the merge past it, and the
# build fails intermittently — sometimes as a GC thrash that kills the daemon,
# sometimes as a bare DexArchiveMergerException. Neither is a code problem, and
# both look like one.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
